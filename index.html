<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lakshya Kaushik | Contact</title>
  <meta name="description" content="Connect with Lakshya Kaushik on Instagram, WhatsApp, or Direct Call." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ambient Edge Glow Accents -->
  <div class="ambient-glow glow-top-left" aria-hidden="true"></div>
  <div class="ambient-glow glow-top-right" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom-left" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom-right" aria-hidden="true"></div>

  <main class="contact-card">
    
    <!-- Top Instagram Focus Section -->
    <section class="instagram-section">
      <!-- Faint concentric radar halo rings -->
      <div class="halo-container" aria-hidden="true">
        <div class="halo-ring ring-0"></div>
        <div class="halo-ring ring-1"></div>
        <div class="halo-ring ring-2"></div>
        <div class="halo-ring ring-3"></div>
      </div>

      <!-- Main Instagram App Icon -->
      <a href="https://www.instagram.com/serenmuzic/" target="_blank" rel="noopener noreferrer" class="instagram-icon-box" aria-label="Visit Lakshya Kaushik on Instagram">
        <svg viewBox="0 0 24 24" class="instagram-camera-svg" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5" fill="none" stroke="#ffffff" stroke-width="2.1"/>
          <circle cx="12" cy="12" r="4.3" fill="none" stroke="#ffffff" stroke-width="2.1"/>
          <circle cx="17.5" cy="6.5" r="1.3" fill="#ffffff"/>
        </svg>
      </a>

      <!-- Headings -->
      <div class="heading-group">
        <h2 class="sub-heading">FOLLOW ON</h2>
        <h1 class="main-heading">INSTAGRAM</h1>
      </div>

      <!-- Profile Pill -->
      <a href="https://www.instagram.com/serenmuzic/" target="_blank" rel="noopener noreferrer" class="profile-pill" aria-label="Instagram handle serenmuzic">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="instaIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f09433"/>
                <stop offset="25%" stop-color="#e6683c"/>
                <stop offset="50%" stop-color="#dc2743"/>
                <stop offset="75%" stop-color="#cc2366"/>
                <stop offset="100%" stop-color="#bc1888"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5" fill="none" stroke="url(#instaIconGrad)" stroke-width="2.1"/>
            <circle cx="12" cy="12" r="4.3" fill="none" stroke="url(#instaIconGrad)" stroke-width="2.1"/>
            <circle cx="17.5" cy="6.5" r="1.3" fill="url(#instaIconGrad)"/>
          </svg>
        </span>
        <span class="pill-divider" aria-hidden="true"></span>
        <span class="pill-handle">@serenmuzic</span>
      </a>
    </section>

    <!-- Two Primary Contact CTAs -->
    <section class="cta-section" aria-label="Contact actions">
      
      <!-- WhatsApp CTA -->
      <a href="https://wa.me/916396200867?text=Hi%20Lakshya%2C%20I%27d%20like%20to%20enquire%20about%20a%20live%20performance." target="_blank" rel="noopener noreferrer" class="cta-btn btn-whatsapp" aria-label="Enquire via WhatsApp">
        <div class="cta-left">
          <span class="cta-icon whatsapp-icon-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" fill="#ffffff"/>
            </svg>
          </span>
          <span class="btn-divider" aria-hidden="true"></span>
        </div>
        <span class="cta-label">WHATSAPP</span>
        <span class="cta-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <!-- Call Me CTA -->
      <a href="tel:+916396200867" class="cta-btn btn-call" aria-label="Direct Phone Call">
        <div class="cta-left">
          <span class="cta-icon call-icon-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.94.36 1.88.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.93.34 1.87.58 2.81.7A2 2 0 0 1 22 16.92Z" fill="#ffffff"/>
            </svg>
          </span>
          <span class="btn-divider" aria-hidden="true"></span>
        </div>
        <span class="cta-label">CALL ME</span>
        <span class="cta-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <!-- Phone Number Line Display -->
      <div class="phone-display">
        <span class="line" aria-hidden="true"></span>
        <a href="tel:+916396200867" class="phone-link">+91 63962 00867</a>
        <span class="line" aria-hidden="true"></span>
      </div>

    </section>

    <!-- Bottom Decorative Ambient Waves -->
    <div class="bottom-waves" aria-hidden="true">
      <svg viewBox="0 0 430 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
            <stop offset="50%" stop-color="#f472b6" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#fb923c" stop-opacity="0.3"/>
          </linearGradient>
          <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
            <stop offset="60%" stop-color="#f472b6" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#fda4af" stop-opacity="0.25"/>
          </linearGradient>
        </defs>
        <path d="M -20 110 C 90 145, 180 80, 290 115 C 360 135, 410 120, 460 100" fill="none" stroke="url(#waveGrad1)" stroke-width="1.8"/>
        <path d="M -20 135 C 110 165, 210 120, 310 140 C 370 152, 420 138, 460 125" fill="none" stroke="url(#waveGrad2)" stroke-width="1.4"/>
      </svg>
    </div>

  </main>
</body>
</html>
